name: Publish H3 Studio ARM64 image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - package.json
      - package-lock.json
      - tsconfig.json
      - tsconfig.server.json
      - vite.config.ts
      - index.html
      - src/**
      - server/**
      - .github/workflows/publish-app-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            NODE_IMAGE=node:22-bookworm-slim
          tags: |
            ghcr.io/xiaofei-fei/h3-studio-gb10/app:main
            ghcr.io/xiaofei-fei/h3-studio-gb10/app:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
